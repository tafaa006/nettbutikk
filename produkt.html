<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produktdetaljer – Pikselbua</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" id="logo">Pikselbua</a>
        <nav>
            <a href="index.html#forside">Forside</a>
            <a href="index.html#produkter">Produkter</a>
            <a href="index.html#om-oss">Om oss</a>
        </nav>
    </header>

    <main>
        <section id="produktdetalj">
            <a href="index.html#produkter" class="knapp-lenke">&larr; Tilbake til produkter</a>

            <div id="produktVisning" class="produkt-side">
                <div class="produkt-side-bilde">
                    <img id="produktBilde" src="" alt="">
                </div>
                <div class="produkt-side-info">
                    <h2 id="produktNavn"></h2>
                    <p class="vurdering">
                        <span id="produktStjerner" class="stjerner"></span>
                        <span id="produktVurdering"></span>
                    </p>
                    <div class="prisboks">
                        <span id="produktSpar" class="spar"></span>
                        <p class="pris"><span id="produktPris"></span> kr</p>
                        <p class="forpris">Før <span id="produktForpris"></span> kr</p>
                    </div>
                    <p id="produktLager" class="lagerstatus paa-lager"></p>
                    <a id="produktKjop" href="#">Legg til i handlekurv</a>
                    <p id="produktBeskrivelse" class="beskrivelse"></p>
                    <h3>Spesifikasjoner</h3>
                    <ul id="produktSpesifikasjoner" class="spesifikasjoner"></ul>
                </div>
            </div>

            <p id="ikkeFunnet" style="display: none;">Fant ikke produktet.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Pikselbua</p>
    </footer>

    <script src="produkt.js"></script>
</body>
</html>
